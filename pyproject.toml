[project]
name = "fastapi-boilerplate"
version = "0.1.0"
description = "Production-ready FastAPI backend boilerplate"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlmodel>=0.0.22",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "pyjwt>=2.10.0",
    "pwdlib[argon2]>=0.2.1",
    "python-multipart>=0.0.12",
    "slowapi>=0.1.9",
    "email-validator>=2.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "asgi-lifespan>=2.1.0",
    "aiosqlite>=0.20.0",
    "ruff>=0.8.0",
    "pre-commit>=4.0.0",
    "commitizen>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "ARG",  # flake8-unused-arguments
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "ASYNC",# flake8-async
    "S",    # flake8-bandit
    "RUF",  # ruff-specific
]
ignore = [
    "B008",  # function calls in argument defaults (required by FastAPI Depends)
    "S101",  # assert is fine in tests
]

[tool.ruff.lint.per-file-ignores]
# `request` is required by slowapi decorators; handler signatures are fixed by FastAPI.
"app/api/**/*.py" = ["ARG001"]
"app/main.py" = ["ARG001"]
"app/core/config.py" = ["S105"]
"app/schemas/user.py" = ["S105"]
"tests/**/*.py" = ["S105", "S106", "ARG001"]
"alembic/**/*.py" = ["ARG001", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_provider = "pep621"
update_changelog_on_bump = true
major_version_zero = true
changelog_merge_prerelease = true
